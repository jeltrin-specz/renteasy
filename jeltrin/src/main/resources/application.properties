# ==========================================
# RENT-EASY APPLICATION PROPERTIES
# ==========================================
server.port=8080
spring.application.name=RentEasy

# ------------------------------------------
# Database Configuration (MySQL 8 Default)
# ------------------------------------------
# For MySQL: override with DB_URL, DB_USERNAME, DB_PASSWORD environment variables if needed
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/renteasy_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------
# Business & Penalty Rules Configuration
# ------------------------------------------
# Default daily penalty rate in INR (₹)
renteasy.penalty.daily-rate=100.0
# Default grace period days before penalty starts
renteasy.penalty.grace-period-days=0
# Default rent due day of the month (e.g. 5th of each month)
renteasy.rent.default-due-day=5

# ------------------------------------------
# Swagger / OpenAPI Documentation
# ------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ------------------------------------------
# Actuator
# ------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
